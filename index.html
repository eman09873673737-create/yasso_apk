<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10291c">
  <title>YASSO PEAS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading">
    <h1>YASSO <span>PEAS</span></h1>
    <p>جاري تجهيز الملعب...</p>
  </div>

  <header id="hud">
    <div class="scoreboard">
      <span>YASSO</span>
      <strong><span id="homeScore">0</span> - <span id="awayScore">0</span></strong>
      <span>RIVALS</span>
      <small id="clock">00:00</small>
    </div>
    <div id="status">استعد للمباراة</div>
  </header>

  <main id="menu">
    <div class="panel">
      <h1>YASSO <span>PEAS</span></h1>
      <p>محاكي كرة قدم ثلاثي الأبعاد</p>
      <button id="startBtn" class="primary">ابدأ المباراة</button>
      <small>نسخة تجريبية قيد التطوير</small>
    </div>
  </main>

  <section id="controls">
    <div id="joystick">
      <div id="stickKnob"></div>
    </div>
    <div class="actions">
      <button id="switchBtn">تبديل</button>
      <button id="passBtn">تمرير</button>
      <button id="shootBtn" class="shoot">تسديد</button>
      <button id="sprintBtn">جري</button>
    </div>
  </section>

  <div id="error" hidden></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
